name: Markdown Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/markdown-link-check.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install lychee
        run: |
          LYCHEE_VERSION="0.24.2"
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" --strip-components=1 "lychee-x86_64-unknown-linux-musl/lychee"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/lychee" --version
      - name: Run lychee
        run: lychee --offline --no-progress --config lychee.toml .
